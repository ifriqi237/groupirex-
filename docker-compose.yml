# Démarrage local : docker compose up --build   puis   http://localhost:4000
# Jeu de démonstration : docker compose exec app node dist/cli.js seed-demo
#
# Ce fichier lance un environnement de DÉMONSTRATION (paiement simulé).
# Pour la production : voir « Mise en production » dans le README.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: groupdeals
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-groupdeals}
      POSTGRES_DB: groupdeals
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groupdeals -d groupdeals"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000}
      DATABASE_URL: postgres://groupdeals:${POSTGRES_PASSWORD:-groupdeals}@db:5432/groupdeals
      JWT_SECRET: ${JWT_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-sandbox}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
      FLUTTERWAVE_WEBHOOK_HASH: ${FLUTTERWAVE_WEBHOOK_HASH:-}
      REQUIRE_STAFF_2FA: ${REQUIRE_STAFF_2FA:-false}
      DEFAULT_COUNTRY: ${DEFAULT_COUNTRY:-CM}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      - uploads:/data/uploads
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
